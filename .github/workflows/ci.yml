# Автоматическая проверка перед ревью.
# Красный результат означает, что работа к проверке не принимается:
# приведите код в порядок и запушьте в ту же ветку — проверка запустится заново.

name: Проверка работы

on:
  pull_request:
    branches: [main]

# Достаточно проверять последний коммит: предыдущие запуски отменяются,
# чтобы не расходовать минуты Actions впустую.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Форматирование, анализ, тесты
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Без этой проверки работа со сбитой структурой проходит «зелёной»:
      # все шаги ниже включаются условием hashFiles(...), и если проект лежит
      # не там, где ожидается, они просто пропускаются — ни форматирование,
      # ни анализ, ни тесты не выполняются. Проверка стоит до установки SDK,
      # чтобы не тратить минуты Actions впустую.
      - name: Структура репозитория
        run: |
          console=0; flutter_app=0
          [ -f bookshelf_console/pubspec.yaml ] && console=1
          [ -f bookshelf/pubspec.yaml ] && flutter_app=1

          if [ "$console" = 1 ] || [ "$flutter_app" = 1 ]; then
            echo "Найдены проекты: console=$console flutter=$flutter_app"
            exit 0
          fi

          echo "::error::Не найден ни bookshelf_console/pubspec.yaml, ни bookshelf/pubspec.yaml — проверять нечего."
          echo
          echo "Проекты курса должны лежать в отдельных каталогах:"
          echo "  bookshelf_console/   занятия 1-5   (dart create bookshelf_console)"
          echo "  bookshelf/           занятия 6-13  (flutter create bookshelf)"
          echo

          if [ -f pubspec.yaml ]; then
            name="$(sed -n 's/^name:[[:space:]]*//p' pubspec.yaml | head -1)"
            echo "В корне репозитория найден pubspec.yaml (name: ${name:-?})."
            echo "Похоже, проект создан прямо в корне. Перенесите его:"
            echo
            echo "  mkdir bookshelf_console"
            echo "  git mv bin lib test pubspec.yaml pubspec.lock analysis_options.yaml bookshelf_console/"
            echo "  git commit -m 'Перенести проект в bookshelf_console/'"
          else
            echo "Содержимое корня репозитория:"
            ls -A
          fi
          exit 1

      # Версия закреплена намеренно. Если её не фиксировать, CI будет
      # обновляться сам и разойдётся с тем, что стоит у студентов: правила
      # dart format между версиями меняются, и работа, отформатированная
      # локально, начнёт краснеть в проверке. Менять только вместе с
      # требованием в README.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Версия инструментов
        run: |
          flutter --version
          dart --version

      # --- Консольный проект: занятия 1–5 ---------------------------------
      - name: Консольный проект — зависимости
        if: hashFiles('bookshelf_console/pubspec.yaml') != ''
        working-directory: bookshelf_console
        run: dart pub get

      - name: Консольный проект — форматирование
        if: hashFiles('bookshelf_console/pubspec.yaml') != ''
        working-directory: bookshelf_console
        run: dart format --output=none --set-exit-if-changed .

      - name: Консольный проект — статический анализ
        if: hashFiles('bookshelf_console/pubspec.yaml') != ''
        working-directory: bookshelf_console
        run: dart analyze

      - name: Консольный проект — тесты
        if: hashFiles('bookshelf_console/test/**') != ''
        working-directory: bookshelf_console
        run: dart test

      # --- Flutter-проект: занятия 6–13 -----------------------------------
      - name: Flutter-проект — зависимости
        if: hashFiles('bookshelf/pubspec.yaml') != ''
        working-directory: bookshelf
        run: flutter pub get

      - name: Flutter-проект — форматирование
        if: hashFiles('bookshelf/pubspec.yaml') != ''
        working-directory: bookshelf
        run: dart format --output=none --set-exit-if-changed .

      - name: Flutter-проект — статический анализ
        if: hashFiles('bookshelf/pubspec.yaml') != ''
        working-directory: bookshelf
        run: flutter analyze

      - name: Flutter-проект — тесты
        if: hashFiles('bookshelf/test/**') != ''
        working-directory: bookshelf
        run: flutter test
