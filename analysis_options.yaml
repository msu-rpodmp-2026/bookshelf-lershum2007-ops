# Настройки анализатора для КОРНЯ репозитория.
#
# Зачем файл нужен. В корне лежат каталоги examples/ и starters/ — это
# самостоятельные программы к занятиям, а не часть вашего проекта. У них нет
# своего pubspec.yaml, а Flutter-примеры и заготовки импортируют
# package:flutter/material.dart, который в корне не подключён. Без этого файла
# команда `dart analyze`, запущенная в корне репозитория, выдаёт больше тысячи
# ошибок — все до одной мнимые, и разбираться в них бессмысленно.
#
# Ваш собственный код этот файл не затрагивает: у проектов bookshelf_console/
# и bookshelf/ есть свои analysis_options.yaml, и при запуске анализа внутри
# проекта действуют именно они.
#
# Удалять файл не нужно. Если дописываете сюда свои правила — помните, что
# путь в exclude отсчитывается от каталога, где лежит этот файл, и за его
# пределы (через ../) не действует.

analyzer:
  exclude:
    - examples/**
    - starters/**
